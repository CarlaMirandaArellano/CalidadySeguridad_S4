version: "3.8"

services:
  db:
    build:
      context: ./mysql
    container_name: mysql-cdy2203-s4
    restart: unless-stopped
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      net:
        aliases:
          - mysql-cdy2203

  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins-cdy2203-s4
    restart: unless-stopped
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    networks:
      - net

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube-cdy2203-s4
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - net

networks:
  net:
    driver: bridge

volumes:
  mysql_data:
  jenkins_home:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
